[package]
name = "rust_project"
version = "0.1.0"
authors = ["Carlos Sotello"]
edition = "2018"

[dependencies]
yew = {version = "0.20", features = ['csr']}
console_error_panic_hook = "0.1.7"
gloo-storage = "0.4"
gloo-file = "0.3"
web-sys = "0.3"
yew-router = "0.17.0"
wasm-bindgen = "0.2.74"
base64 = "0.13.0"
rand = { version = "0.7.3", features = ["wasm-bindgen"] }
bcrypt = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-console = "0.4.0"

[lib]
name = "db"
path = "src/db.rs"
